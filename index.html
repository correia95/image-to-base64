    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Image to Base64",
        "url": "https://image-to-base64.correia95.workers.dev/",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Convert an image to a Base64 data URI for HTML, CSS or Markdown, and decode a data URI back to an image, entirely in the browser with no upload."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do I convert an image to Base64?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Drop an image onto the box or click to choose one. The tool reads it with the browser's FileReader and shows the Base64 data URI, which you can copy as a raw string, an img tag, a CSS background rule or Markdown."
            }
          },
          {
            "@type": "Question",
            "name": "How much bigger does Base64 make an image?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "About 33% larger, because Base64 uses four characters for every three bytes. The tool shows the exact encoded size and percentage increase. Data URIs are best kept for small assets."
            }
          },
          {
            "@type": "Question",
            "name": "Is the image uploaded to a server?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. The image is read and encoded entirely in your browser. Nothing is uploaded and the page works offline once loaded."
            }
          },
          {
            "@type": "Question",
            "name": "Can I convert Base64 back to an image?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Switch to the \"Base64 → Image\" tab, paste a data URI, and the tool previews the image and offers it as a download."
            }
          }
        ]
      }
    </script>
